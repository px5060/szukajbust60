function hit(P, i) {

// wersja A: cykle i BUST-y w progach, min. BUST-ów, max powtórek (BUST od razu po BUST-cie)
function minFor(cyc, rules) { for (const r of rules) if (r[0] === null || cyc <= r[0]) return r[2] || 0; return 0; }   // „od X BUST” w przedziale cykli

function findModel(q) { const m = /^\s*[pP]?\s*(\d+)\s*$/.exec(q || ''); if (!m) return -1; const k = +m[1] - 1; return k >= 0 && k < POOLS[tgt].pool.length ? k : -2; }
function findHtml() {
  const n = POOLS[tgt].pool.length;
  let h = `<div class="sec"><div class="sh"><b>Znajdź model po nazwie</b><span class="m">BET ${tgt} · P1–P${n}</span></div>
    <div class="selrow"><input id="findIn" placeholder="np. P123" value="${esc(findQ)}" autocomplete="off" autocapitalize="characters"><button class="btn pri" id="findBtn">Znajdź</button></div>`;
  if (findQ) {
    const k = findModel(findQ);
    if (k === -1) h += `<div class="hint">Wpisz nazwę modelu, np. P123 (albo samą liczbę 123).</div>`;
    else if (k === -2) h += `<div class="hint">Nie ma modelu ${esc(findQ.toUpperCase())} w puli BET ${tgt} — nazwy są od P1 do P${n}.</div>`;
    else if (!lastEval || busy) h += `<div class="hint">Liczę…</div>`;
    else {
      const r = lastEval.out[k], mine = isMine(k);
      h += `<div style="margin-top:8px">${card(k, P[k], r, phaseOf(r))}</div><div style="display:flex;gap:6px;flex-wrap:wrap">` +
        `<button class="btn" id="findTab">Otwórz TABELĘ</button>` +
        (mine ? `<button class="btn" disabled>▶ już jest w MOJE GRY</button>` : `<button class="btn pri" id="findPlay">▶ Gram ten model — do MOJE GRY (krok ${r.bs + 1}, ${ST[r.bs]} zł)</button>`) + `</div>` +
        (qual(r) ? '' : `<div class="hint">Uwaga: ten model teraz nie spełnia kryteriów (na GRA go nie widać), ale możesz go grać.</div>`);
    }
  }
  return h + `<div class="hint">Nazwy modeli (P…) są takie same na każdym urządzeniu z tą samą wersją appki (${APP_VER}). Wpisz nazwę modelu, który grasz na innym urządzeniu, i dodaj go tu do MOJE GRY.</div></div>`;
}
function renderUst() {
  const f = getFound().length;
  let h = findHtml() + `<div class="sec"><div class="sh"><b>Kryteria modelu</b><span class="m">sprawdzane po każdym kodzie</span></div><table class="rules">
    <tr><th>cykle do</th><th>od BUST</th><th>max BUST</th></tr>` +
    R.rules.map((r, i) => `<tr><td>${r[0] === null ? `ponad ${topCyc()}` : `<input data-i="${i}" data-j="0" value="${r[0]}" inputmode="numeric">`}</td><td><input data-i="${i}" data-j="2" value="${r[2] || 0}" inputmode="numeric"></td><td><input data-i="${i}" data-j="1" value="${r[1]}" inputmode="numeric"></td></tr>`).join('') +
    `<tr><td>min. cykli</td><td></td><td><input id="minC" value="${R.minCyc}" inputmode="numeric"></td></tr>
    <tr><td>min. BUST-ów (wszędzie)</td><td></td><td><input id="minB" value="${R.minBust}" inputmode="numeric"></td></tr>
    <tr><td>max BUST od razu po BUST-cie</td><td></td><td><input id="maxCl" value="${R.maxClose}" inputmode="numeric"></td></tr></table>
    <div style="display:flex;gap:6px;margin-top:8px"><button class="btn pri" id="saveR">Zapisz</button><button class="btn" id="defR">Domyślne</button></div>
    <div class="hint"><b>od BUST</b> = najmniej BUST-ów w tym przedziale cykli (0 = bez dolnej granicy), np. 201–300 cykli: od 6 do 9 BUST + „max BUST od razu po BUST-cie” 0–1 → modele z wieloma BUST-ami, ale bez podwójnych.<br>
    Domyślnie: do 200 cykli max 5 BUST, do 300 max 9, do 400 max 11, ponad 400 max 11 (★), min. ${CFG.minCyc} cykli, min. ${CFG.minBust} BUST-y
    (1–2 BUST-y mało mówią o powtórkach), BUST od razu po BUST-cie max ${CFG.maxClose}×. Mniej BUST-ów = rzadziej BUST; 0 powtórek = BUST nigdy nie przyszedł od razu po BUST-cie.</div></div>` + repHtml(true);
  h += `<div class="sec"><div class="sh"><b>Pula modeli (z chmury)</b><span class="m">ta sama na każdym urządzeniu</span></div>
    <div class="kv"><span>modele w puli</span><b>${POOLS[tgt].pool.length.toLocaleString('pl')}</b><span>pula policzona na kodach do Nr</span><b>${POOLS[tgt].seedN.toLocaleString('pl')}</b><span>kody w appce teraz</span><b>${codes.length.toLocaleString('pl')}</b></div>
    <div class="hint">Szukanie modeli w telefonie jest wyłączone, żeby telefon, appka i PC pokazywały te same modele. Nowe kody i BUST-y liczą się od razu dla wszystkich modeli z puli.
    Pulę aktualizuje Claude w repo: wyślij mu eksport kodów z ${CFG.razem} — przeliczy miliony modeli na nowym ciągu i wyda nową wersję appki.</div>` +
    (f ? `<div class="hint" style="margin-top:6px">Na tym urządzeniu zostały modele znalezione kiedyś w appce (${f.toLocaleString('pl')}) — nie są już używane.</div><button class="btn" id="clrF" style="margin-top:6px">Usuń stare znalezione z tego urządzenia</button>` : '') + `</div>`;
  h += `<div class="sec"><div class="sh"><b>Import kodów</b><span class="m">teraz ${codes.length.toLocaleString('pl')} kodów</span></div>
    <div class="hint" style="margin:0 0 8px">Plik eksportu z ${CFG.razem} albo z jej tabel (.json z listą <b>codes</b>, pełny ciąg od Nr 1) albo plik tekstowy z kodami.
    Kody muszą zgadzać się z ciągiem w appce — dopisywane są tylko nowe. Trafiają też do ${CFG.razem} (wspólna pamięć).</div>
    <button class="btn pri" id="impBtn">Wybierz plik i importuj</button>
    <input type="file" id="impIn" accept=".json,.txt,application/json,text/plain" style="display:none">
    ${lsGet(LSK.imp, '') ? `<div class="hint">Ostatni import: ${esc(lsGet(LSK.imp, ''))}</div>` : ''}</div>`;
  h += `<div class="note">SZUKAJ BUST ${APP_VER} · ${CFG.razem}: klucz kodów <b>${CFG.seedKey}</b>. Pulę (miliony przeszukanych modeli) liczy skrypt <b>szukaj/search.py</b> w repo. Modele w MOJE / znalezione są osobne od SZUKAJ.</div>`;
  return h;
}
function render() {
  $('hdrN').textContent = `Nr ${codes.length.toLocaleString('pl')} · BET ${tgt}`;
  const el = $('main');
  el.innerHTML = view === 'gra' ? renderGra() : view === 'tab' ? renderTab() : view === 'moje' ? renderMoje() : renderUst();
  const hm = $('hdrModel');   // opis modelu w nagłówku (TABELA / MOJE)
  if (hm) { const m = (view === 'tab' || view === 'moje') && selK !== null && P[selK] && !(view === 'moje' && !getMy().length) ? P[selK] : null;
    hm.innerHTML = m ? `<b>${mid(selK, m)}</b> · ${esc(ruleTxt(m))}<span class="mh">dotknij wiersz → łańcuch STEP/TRIGGER · przytrzymaj → statystyki</span>` : ''; }
  try { document.documentElement.style.setProperty('--hdrH', document.querySelector('header').offsetHeight + 'px'); } catch (e) {}
  const nm = $('navMine'); if (nm) {   // MOJE: model z zakładem na następnym wierszu → przycisk świeci, dopóki nie wejdziesz w MOJE
    const nb = betsOnNextRow().filter(x => x.mine).length, sk = CFG.app + '_moje_seen_' + tgt;
    if (view === 'moje') lsSet(sk, String(codes.length));
    nm.textContent = `MOJE · ${getMy().length}${nb ? ' ▼' + nb : ''}`;
    nm.classList.toggle('glow', nb > 0 && view !== 'moje' && lsGet(sk, '') !== String(codes.length));
  }
  if (view === 'moje') { el.querySelectorAll('[data-mk]').forEach(bindCard); flashCard(); }
  if (view === 'gra') flashCard();
  if (view === 'tab' || view === 'moje') {
    const pb2 = $('playBtn'); if (pb2) pb2.onclick = () => startMy(selK);
    if (lab) {
      if (focusRow != null && lab.K[focusRow] >= 6 && lab.K[focusRow] <= 8) hlBet = focusRow;
      applyHL(el);
      const nr = $('nextRow'); if (nr) { nr.style.cursor = 'pointer'; nr.onclick = () => { hlBet = -1; liveOn = !liveOn; applyHL(el); }; }
      el.querySelectorAll('tr[data-i], #nextRow').forEach(r => {   // przytrzymanie wiersza → STATYSTYKI modelu
        let t = null, x0 = 0, y0 = 0; const cancel = () => { clearTimeout(t); t = null; };
        r.addEventListener('pointerdown', e => { r._lp = false; x0 = e.clientX; y0 = e.clientY; cancel(); t = setTimeout(() => { r._lp = true; openStats(selK); }, 550); });
        r.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel(); });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => r.addEventListener(ev, cancel));
        r.addEventListener('contextmenu', e => { e.preventDefault(); cancel(); r._lp = true; openStats(selK); });
        r.addEventListener('click', e => { if (r._lp) { r._lp = false; e.stopImmediatePropagation(); } }, true);
      });
      el.querySelectorAll('tr[data-i]').forEach(r => r.onclick = () => {
        // ponowne dotknięcie obramowanego wiersza zamyka podświetlenie
        if (/\bhl-/.test(r.className)) { hlBet = -1; liveOn = false; applyHL(el); return; }
        const i = +r.dataset.i, b = betOf(i);
        if (lab && lab.K[i] >= 6 && lab.K[i] <= 8) askRowPop(i);
        if (b >= 0 && b < codes.length) { hlBet = b; applyHL(el); return; }
        const m = P[selK], o = lastEval && lastEval.out[selK];   // wiersz bieżącego łańcucha → pokaż stan TERAZ
        if (o) { const L = liveChain(m, o); if ([].concat(L.step, L.stepPart, L.trig, L.trigPart, L.wait).includes(i)) { hlBet = -1; liveOn = true; applyHL(el); } }
      });
    }
    el.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => { if (confirm('Usunąć z MOJE GRY?')) stopMy(b.dataset.stop); });
    el.querySelectorAll('[data-ord]').forEach(b => b.onclick = () => { tabAsc = b.dataset.ord === '1'; try { localStorage.setItem(CFG.app + '_szbust_v1_asc', tabAsc ? '1' : '0'); } catch (e) {} tabScroll = true; render(); });
    if (lab && tabScroll) { tabScroll = false; if (tabAsc) setTimeout(() => scrollTo(0, document.documentElement.scrollHeight), 0); }
    doFlash(el);
    if (lab && focusRow != null) { const fr = el.querySelector(`tr[data-i="${focusRow}"]`); focusRow = null; if (fr) setTimeout(() => { fr.scrollIntoView({ block: 'center' }); fr.classList.add('fx'); setTimeout(() => fr.classList.remove('fx'), 2600); }, 0); }
    $('evChk') && ($('evChk').onchange = e => { tabEv = e.target.checked; render(); });
    const mb = $('moreBtn'); if (mb) mb.onclick = () => { const h0 = document.documentElement.scrollHeight, y0 = scrollY; tabN += 150; render(); if (tabAsc) scrollTo(0, y0 + document.documentElement.scrollHeight - h0); };
  }
  if (view === 'gra') {
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const k = +b.dataset.k; KS = KS.includes(k) ? KS.filter(x => x !== k) : [...KS, k].sort((a, b) => a - b); lsSet(LSK.ks, JSON.stringify(KS)); render();
    });
    el.querySelectorAll('[data-only]').forEach(b => b.onclick = () => { afterOnly = !afterOnly; try { localStorage.setItem(CFG.app + '_szbust_v1_gra_only', afterOnly ? '1' : '0'); } catch (e) {} render(); });
    el.querySelectorAll('[data-mine]').forEach(b => b.onclick = () => { onlyMine = !onlyMine; try { localStorage.setItem(CFG.app + '_szbust_v1_onlymine', onlyMine ? '1' : '0'); } catch (e) {} render(); scrollTo(0, 0); });
    el.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
      const all = R.rules.map((_, j) => j), i = +b.dataset.b;   // jeden przedział cykli naraz; ponowne dotknięcie = wszystkie (żaden nie podświetlony)
      BANDS = BANDS.length === 1 && BANDS[0] === i ? all : [i]; lsSet(LSK.bands, JSON.stringify(BANDS)); render();
    });
    el.querySelectorAll('[data-stop]').forEach(b => b.onclick = e => { e.stopPropagation(); if (confirm('Usunąć z MOJE GRY?')) stopMy(b.dataset.stop); });
    el.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { const i = +b.dataset.more; bandCap[i] = (bandCap[i] || 15) + 30; render(); });
    el.querySelectorAll('[data-mk]').forEach(bindCard);
  }
  if (view === 'ust') {
    const fi = $('findIn'), go = () => { findQ = fi.value.trim(); render(); };
    $('findBtn').onclick = go; fi.onkeydown = e => { if (e.key === 'Enter') go(); };
    const ft = $('findTab'); if (ft) ft.onclick = () => openTab(findModel(findQ));
    const fp = $('findPlay'); if (fp) fp.onclick = () => startMy(findModel(findQ));
    el.querySelectorAll('[data-mk]').forEach(bindCard);
    $('saveR').onclick = () => {
      const rules = R.rules.map(r => [...r]);
      el.querySelectorAll('.rules input[data-i]').forEach(i => { rules[+i.dataset.i][+i.dataset.j] = Math.max(0, parseInt(i.value, 10) || 0); });
      rules.sort((a, b) => (a[0] === null) - (b[0] === null) || a[0] - b[0]);
      R = Object.assign(defR(), { rules, minCyc: Math.max(1, parseInt($('minC').value, 10) || 1), minBust: Math.max(1, parseInt($('minB').value, 10) || 1), maxClose: Math.max(0, parseInt($('maxCl').value, 10) || 0) });
      lsSet(LSK.rules, JSON.stringify(R)); toast('Zapisano kryteria'); recompute();
    };
    $('defR').onclick = () => { R = defR(); lsSet(LSK.rules, ''); recompute(); };
    $('impBtn').onclick = () => $('impIn').click();
    $('impIn').onchange = e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { try { importCodes(rd.result, f.name); } catch (err) { alert('Import przerwany, nic nie zmieniono:\n' + err.message); } };
      rd.readAsText(f);
    };
    if ($('clrF')) $('clrF').onclick = () => { if (confirm('Usunąć stare modele znalezione w appce z tego urządzenia?')) { lsSet(foundKey(), '[]'); recompute(); } };
  }
}
hint(); renderTgt(); recompute();
// świeżość: SW (strona zawsze z sieci) + sprawdzenie wersji na serwerze
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('szukaj-sw.js', { scope: './' }).catch(() => {}); } catch (e) {}
let instEv = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEv = e; $('instBtn').style.display = 'block'; });
$('instBtn').onclick = async () => { if (!instEv) return; instEv.prompt(); try { await instEv.userChoice; } catch (e) {} instEv = null; $('instBtn').style.display = 'none'; };
async function checkVersion() {
  try {
    const t = await (await fetch(location.pathname + '?nocache=' + Date.now(), { cache: 'no-store' })).text();
    const m = /const APP_VER = '([^']+)'/.exec(t);
    if (m && m[1] !== APP_VER && !$('updBan')) {
      const d = document.createElement('div'); d.id = 'updBan'; d.className = 'upd';
      d.textContent = `Jest nowa wersja ${m[1]} (masz ${APP_VER}) — stuknij, żeby odświeżyć`;
      d.onclick = () => location.replace(location.pathname + '?v=' + m[1]);
      $('main').prepend(d);
    }
  } catch (e) {}
}
checkVersion(); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });
</script>
